# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json?ref_type=heads
# https://wikitech.wikimedia.org/wiki/Help:Toolforge/Deploy_your_tool
config_version: v1beta1
source_url: https://raw.githubusercontent.com/simon04/bldrwnsch/master/toolforge.yaml
components:
  web:
    component_type: continuous
    build:
      repository: https://github.com/simon04/bldrwnsch
      ref: master
    run:
      command: web
      port: 8000
      publish: /
      mount: all
      health_check_http: /healthz
  bldrwnsch:
    component_type: scheduled
    build:
      reuse_from: web
    run:
      command: update
      schedule: '@hourly'
      memory: 1G
      mount: all
      emails: onfailure
      filelog: true
      filelog_stdout: bldrwnsch.out
      filelog_stderr: bldrwnsch.err
